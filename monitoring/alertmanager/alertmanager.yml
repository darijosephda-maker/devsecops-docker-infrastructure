global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alertes@example.com'
  smtp_auth_username: 'alertes@example.com'
  smtp_auth_password: 'CHANGE_ME_APP_PASSWORD'
  smtp_require_tls: true

route:
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'email-uts'

receivers:
  - name: 'email-uts'
    email_configs:
      - to: 'alertes@example.com'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
